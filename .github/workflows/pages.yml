name: pages

# Builds the website (site/ plus the Markdown in docs/) and, on main,
# publishes it to GitHub Pages. Pull requests only build it, so a broken
# docs link or build script shows up before merge.
on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", "internal/web/static/fonts/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "site/**", "internal/web/static/fonts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: build the site
        working-directory: site
        run: npm ci && node build.mjs && node check-links.mjs
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
